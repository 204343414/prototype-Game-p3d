<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Prototype P3D 本地查看器</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #e6e6e6; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #sidebar { width: 340px; min-width: 340px; background: #1c1f26; border-right: 1px solid #2c313c; display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 15px; padding: 14px 14px 6px; margin: 0; color: #7fd4ff; }
  #sidebar .sub { padding: 0 14px 10px; font-size: 12px; color: #8a93a3; line-height: 1.5; }
  #pathbar { display: flex; padding: 8px; gap: 6px; border-top: 1px solid #2c313c; border-bottom: 1px solid #2c313c; }
  #pathinput { flex: 1; background: #11131a; border: 1px solid #333a47; color: #e6e6e6; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
  #gobtn, #upbtn { background: #2c313c; border: none; color: #e6e6e6; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  #gobtn:hover, #upbtn:hover { background: #394254; }
  #filelist { flex: 1; overflow-y: auto; padding: 4px 0; }
  .entry { padding: 7px 14px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .entry:hover { background: #262b35; }
  .entry .icon { width: 16px; text-align: center; opacity: 0.8; }
  .entry.dir { color: #ffd479; }
  .entry.model { color: #7fffb0; font-weight: 600; }
  .entry .size { margin-left: auto; color: #6b7280; font-size: 11px; }
  #status { padding: 8px 14px; font-size: 12px; color: #8a93a3; border-top: 1px solid #2c313c; min-height: 34px; }
  #viewer { flex: 1; position: relative; }
  #canvas-host { position: absolute; inset: 0; }
  #hint { position: absolute; top: 12px; left: 12px; font-size: 12px; color: #8a93a3; background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 6px; max-width: 420px; line-height: 1.6; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 14px; color: #7fd4ff; display: none; }
  a { color: #7fd4ff; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>🗂 Prototype P3D 本地查看器</h1>
    <div class="sub">
      在下方输入任意本地路径（比如解包出来的 <code>art/</code> 目录），
      浏览并点击 <b>.glb</b> / <b>.gltf</b> 文件即可预览。<br/>
      仅供个人研究与同人创作使用，详见项目根目录 <code>NOTICE.md</code>。
    </div>
    <div id="pathbar">
      <button id="upbtn" title="上一级目录">⬆</button>
      <input id="pathinput" type="text" value="/" />
      <button id="gobtn">Go</button>
    </div>
    <div id="filelist"></div>
    <div id="status">就绪。</div>
  </div>
  <div id="viewer">
    <div id="canvas-host"></div>
    <div id="hint">
      鼠标左键拖动＝旋转，滚轮＝缩放，右键拖动＝平移。<br/>
      当前还不支持直接预览 <code>.p3d</code> 原始格式，
      需要先用 <code>tools/p3d2gltf</code>（开发中）转换成 <code>.glb</code>。
    </div>
    <div id="loading">加载中…</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const filelistEl = document.getElementById("filelist");
const pathInput = document.getElementById("pathinput");
const statusEl = document.getElementById("status");
const loadingEl = document.getElementById("loading");

function setStatus(msg) { statusEl.textContent = msg; }

async function browse(path) {
  setStatus("正在读取目录…");
  try {
    const res = await fetch(`/api/browse?path=${encodeURIComponent(path)}`);
    const data = await res.json();
    if (data.error) {
      setStatus("错误：" + data.error);
      return;
    }
    pathInput.value = data.path;
    renderList(data);
    setStatus(`${data.entries.length} 个条目`);
  } catch (e) {
    setStatus("请求失败：" + e);
  }
}

function humanSize(bytes) {
  if (bytes < 0) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1024/1024).toFixed(1) + " MB";
}

function renderList(data) {
  filelistEl.innerHTML = "";
  for (const entry of data.entries) {
    const div = document.createElement("div");
    const isModel = /\.(glb|gltf)$/i.test(entry.name);
    div.className = "entry " + (entry.is_dir ? "dir" : (isModel ? "model" : ""));
    const icon = entry.is_dir ? "📁" : (isModel ? "🧊" : "📄");
    div.innerHTML = `<span class="icon">${icon}</span><span class="name"></span><span class="size">${entry.is_dir ? "" : humanSize(entry.size)}</span>`;
    div.querySelector(".name").textContent = entry.name;
    div.onclick = () => {
      const full = data.path.replace(/\/$/, "") + "/" + entry.name;
      if (entry.is_dir) {
        browse(full);
      } else if (isModel) {
        loadModel(full);
      } else {
        setStatus("这不是受支持的模型文件（需要 .glb / .gltf）：" + entry.name);
      }
    };
    filelistEl.appendChild(div);
  }
}

document.getElementById("gobtn").onclick = () => browse(pathInput.value);
document.getElementById("upbtn").onclick = async () => {
  const res = await fetch(`/api/browse?path=${encodeURIComponent(pathInput.value)}`);
  const data = await res.json();
  if (data.parent) browse(data.parent);
};
pathInput.addEventListener("keydown", (e) => { if (e.key === "Enter") browse(pathInput.value); });

// ---- three.js viewer setup ----
const host = document.getElementById("canvas-host");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);

const camera = new THREE.PerspectiveCamera(50, host.clientWidth / host.clientHeight, 0.01, 1000);
camera.position.set(2, 2, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(host.clientWidth, host.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x33383f, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(3, 6, 4);
scene.add(dirLight);

const grid = new THREE.GridHelper(10, 20, 0x444c5a, 0x2a2f38);
scene.add(grid);

let currentModel = null;
let mixer = null;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = host.clientWidth / host.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(host.clientWidth, host.clientHeight);
});

const loader = new GLTFLoader();

function loadModel(path) {
  loadingEl.style.display = "block";
  setStatus("加载模型：" + path);
  const url = `/api/file?path=${encodeURIComponent(path)}`;
  loader.load(url, (gltf) => {
    if (currentModel) scene.remove(currentModel);
    currentModel = gltf.scene;
    scene.add(currentModel);

    // auto-frame camera to fit model
    const box = new THREE.Box3().setFromObject(currentModel);
    const size = box.getSize(new THREE.Vector3()).length();
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    camera.position.copy(center).add(new THREE.Vector3(size, size * 0.6, size));
    camera.near = size / 100;
    camera.far = size * 100;
    camera.updateProjectionMatrix();

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(currentModel);
      mixer.clipAction(gltf.animations[0]).play();
      setStatus(`已加载：${path}（含 ${gltf.animations.length} 个动画片段，正在播放第一个）`);
    } else {
      mixer = null;
      setStatus(`已加载：${path}（无动画数据）`);
    }
    loadingEl.style.display = "none";
  }, undefined, (err) => {
    loadingEl.style.display = "none";
    setStatus("加载失败：" + err.message);
    console.error(err);
  });
}

// initial browse at root (or wherever the server restricts us to)
browse(pathInput.value);
</script>
</body>
</html>
